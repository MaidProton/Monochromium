name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Match package version to release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: npm version "$(($env:GITHUB_REF_NAME).TrimStart('v'))" --no-git-tag-version

      - name: Build Squirrel.Windows installer
        run: npm run desktop:make

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "out/make/squirrel.windows/x64"
          $assets = @(Get-ChildItem -LiteralPath $releaseDir -File | Where-Object {
            $_.Name -eq "RELEASES" -or $_.Extension -in @(".exe", ".nupkg")
          } | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "No Squirrel release artifacts were produced." }
          gh release create $env:GITHUB_REF_NAME @assets --title "Monochromium $env:GITHUB_REF_NAME" --generate-notes
