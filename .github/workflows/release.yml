name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Match package version to release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: npm version "$(($env:GITHUB_REF_NAME).TrimStart('v'))" --no-git-tag-version --allow-same-version

      - name: Build Squirrel.Windows installer
        run: npm run desktop:make

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "out/make/squirrel.windows/x64"
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $assets = @(
            (Join-Path $releaseDir "Monochromium-Setup.exe"),
            (Join-Path $releaseDir "monochromium-$version-full.nupkg"),
            (Join-Path $releaseDir "RELEASES")
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing required Squirrel release asset: $asset" }
          }
          $manifest = Get-Content -LiteralPath (Join-Path $releaseDir "RELEASES") -Raw
          if ($manifest -notmatch [regex]::Escape("monochromium-$version-full.nupkg")) { throw "RELEASES does not reference the tagged full package." }
          gh release create $env:GITHUB_REF_NAME @assets --draft --title "Monochromium $env:GITHUB_REF_NAME" --generate-notes
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
